<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Birthday Puzzle 🎁</title>

    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
     <!-- Firefly Glow Cursor -->

<div class="glow-cursor" id="glowCursor">
    <div class="glow-cursor-tail" id="glowCursorTail"></div>
    <div class="glow-cursor-halo"></div>
    <div class="glow-cursor-core"></div>
</div>

<div class="glow-cursor-ring" id="glowCursorRing">
    <svg viewBox="0 0 100 100" class="ring-svg">
        <circle class="ring-path" cx="50" cy="50" r="42"/>
        <circle class="ring-bead" cx="90.6" cy="60.9" r="2.4"/>
        <circle class="ring-bead" cx="46.4" cy="91.8" r="2.4"/>
        <circle class="ring-bead" cx="8.6" cy="42.7" r="2.4"/>
        <circle class="ring-bead" cx="71" cy="13.6" r="2.4"/>
    </svg>
</div>

<canvas class="firefly-canvas" id="fireflyCanvas"></canvas>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
        <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#e8b04b"/>
            <stop offset="50%" stop-color="#f2a3ad"/>
            <stop offset="100%" stop-color="#b9c7a0"/>
        </linearGradient>
    </defs>
</svg>
    <button id="profileBtn" class="site-profile" aria-label="Profile">
    <img src="../Imgs/profile.jpg" alt="Profile">
</button>

<div class="profile-menu" id="profileMenu">
    <button id="restartButton">↩ Restart</button>
    <button id="refreshButton">↻ Refresh</button>
</div>
    <button id="musicButton">
        Play Music
    </button> 

    <section class="game-screen show-game" id="gameScreen">

        <div class="game-content">
            
            <p class="game-small">
                Before Entering...
            </p>

            <h1>
                You have to pass the way.
            </h1>

            <p class="game-instruction">
                Complete this little puzzle
            </p>

            <div class="puzzle" id="puzzle"></div>

        </div>

    </section>

    <script src="../js/puzzle.js"></script>
    <script src="../js/music.js"></script>
    <script src="../js/firefly-cursor.js"></script>
</body>
</html>
