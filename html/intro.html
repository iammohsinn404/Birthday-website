<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Birthday Website 🎂</title>

    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

    <button id="profileBtn" class="site-profile" aria-label="Profile">
    <img src="../Imgs/profile.jpg" alt="Profile">
</button>

<div class="profile-menu" id="profileMenu">

    <button id="levelsButton">
        🎮 Levels
    </button>

    <div class="levels-menu" id="levelsMenu">

        <button data-level="intro.html">
            🏠 Intro
        </button>

        <button data-level="puzzle.html">
            🧩 Level 1 — Puzzle
        </button>

        <button data-level="monkey.html">
            🐒 Level 2 — Monkey
        </button>

        <button data-level="cake.html">
            🎂 Level 3 — Cake
        </button>

        <button data-level="prank.html">
            😈 Level 4 — Prank
        </button>

        <button data-level="birthday.html">
            🎉 Level 5 — Birthday
        </button>

        <button data-level="scratch.html">
            🎁 Level 6 — Scratch
        </button>

    </div>

    <button id="createLinkButton">
        🔗 Create Birthday Link
    </button>

</div>

    <div class="intro-screen" id="introScreen">

        <div class="intro-content">

            <p class="intro-small">
                ✨ Something special is waiting...
            </p>

            <h1>
                Are You Excited?
            </h1>

            <p class="intro-question">
                I Made Something just for youh 🎂
            </p>

            <div class="intro-buttons">

                <button id="yesButton">
                    YES! 🎉
                </button>

                <button id="noButton">
                    NO! 😐
                </button>

            </div>
            <div id="linkGenerator" class="link-generator">
                <h2> Create A Birthday Link</h2>

                <input
                    type="text"
                    id="personName"
                    placeholder="Person's name">

                <input 
                    type="number"
                    id="birthDay"
                    placeholder="Day"
                    min="1"
                    max="31">
                 <input
                  
                  type="number"
                  id="birthMonth"
                  placeholder="Month"
                  min="1"
                  max="12">
                <input
                    type="number"
                    id="birthYear"
                    placeholder="Year"
                    min="1900"
                    max="2050">
                    
                <input     
                    type="text"
                    id="relationship"
                    placeholder="Who is this peron? e.g Best Friend">

                  <button id="generateLinkButton">
                    Generate Link
                  </button>  
                  <div id="generatedLinkBox">
                    <input
                        type="text"
                        id="generatedLink"
                        readonly>
                    <button id="copyLinkButton">
                        Copy Link
                    </button>
                  </div>
            </div>

        </div>

    </div>
<section>
    <script src="../js/intro.js"></script>
    <script src="../js/music.js"></script>
</section>

</body>
</html>
