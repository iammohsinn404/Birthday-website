<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>One Last Secret 💗</title>

    <link
        rel="stylesheet"
        href="../css/styles.css"
    >

</head>


<body>

    <button id="profileBtn" class="site-profile" aria-label="Profile">
    <img src="../Imgs/profile.jpg" alt="Profile">
</button>

<div class="profile-menu" id="profileMenu">
    <button id="restartButton">↩ Restart</button>
    <button id="refreshButton">↻ Refresh</button>
</div>
    <button id="musicButton">
        Play Music
    </button>

    <section
        class="scratch-page scratch-page-open"
        id="scratchPage"
    >

        <div class="scratch-content">


            <p class="scratch-small">
                ✨ One Last Little Secret...
            </p>


            <h1>
                More Forward 💗
            </h1>


            <p class="scratch-instruction">
                Scratch the card to reveal the secret...
            </p>


            <!-- SCRATCH CARD -->

            <div
                class="scratch-card"
                id="scratchCard"
            >

                <div class="hidden-message">

                    <h2>
                        You Found It! 💌
                    </h2>

                    <p>
                        You made it all the way here! ❤️
                    </p>

                    <p>
                        There is always something special
                        waiting for the curious ones. ✨
                    </p>

                </div>


                <canvas id="scratchCanvas"></canvas>

            </div>


            <!-- CONTINUE BUTTON -->

            <button
    class="scratch-continue-button"
    id="scratchContinueButton"
>
    💗 Reveal Final Message
</button>


        </div>

    </section>


    <script src="../js/scratch.js"></script>
    <script src="../js/music.js"></script>

</body>

</html>
