<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Birthday Cake 🎂</title>

    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
    <button id="profileBtn" class="site-profile" aria-label="Profile">
    <img src="../Imgs/profile.jpg" alt="Profile">
</button>

<div class="profile-menu" id="profileMenu">
    <button id="restartButton">↩ Restart</button>
    <button id="refreshButton">↻ Refresh</button>
</div>
    <button id="musicButton">
        Play Music
    </button>

    <section class="cake-page cake-page-open" id="cakePage">

        <button class="cake-close" id="cakeClose">
            ✕
        </button>

        <div class="cake-page-content">

            <p class="cake-small">
                Something Special for Someone Special...
            </p>

            <h1>
                Your Birthday Cake 🎂
            </h1>

            <p class="cake-instruction">
                Click The Cake! 👀
            </p>


            <!-- CAKE AREA -->

            <div class="cake-area" id="cakeArea">

                <div class="cake">

                    <!-- TOP -->

                    <div class="cake-top">

                        <div class="cream cream-1"></div>
                        <div class="cream cream-2"></div>
                        <div class="cream cream-3"></div>

                    </div>


                    <!-- CAKE BODY -->

                    <div class="cake-body">

                        <div class="cake-layer cake-layer-1"></div>
                        <div class="cake-layer cake-layer-2"></div>


                        <!-- PIECE 1 -->

                        <button
                            class="cake-piece piece-1"
                            data-piece="1">
                            <span></span>
                        </button>


                        <!-- PIECE 2 -->

                        <button
                            class="cake-piece piece-2"
                            data-piece="2">
                            <span></span>
                        </button>


                        <!-- PIECE 3 -->

                        <button
                            class="cake-piece piece-3"
                            data-piece="3">
                            <span></span>
                        </button>


                        <!-- PIECE 4 -->

                        <button
                            class="cake-piece piece-4"
                            data-piece="4">
                            <span></span>
                        </button>


                        <!-- PIECE 5 -->

                        <button
                            class="cake-piece piece-5"
                            data-piece="5">
                            <span></span>
                        </button>


                        <!-- PIECE 6 -->

                        <button
                            class="cake-piece piece-6"
                            data-piece="6">
                            <span></span>
                        </button>

                    </div>


                    <!-- CAKE PLATE -->

                    <div class="cake-plate"></div>


                    <!-- CANDLE -->

                    <div class="cake-candle">

                        <div class="candle-flame"></div>

                    </div>

                </div>

            </div>


            <!-- CAKE MESSAGE -->

            <p
                class="cake-message"
                id="cakeMessage">
            </p>


            <!-- MORE FORWARD BUTTON -->

            <button
                class="more-forward-button"
                id="moreForwardButton">

                ✨ More Forward

            </button>

        </div>

    </section>


    <script src="../js/cake.js"></script>

</body>
</html>
