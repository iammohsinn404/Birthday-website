<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Surprise</title>
    <link rel="stylesheet" href="../css/prank.css" />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <!-- Firefly Glow Cursor -->

    <div class="glow-cursor" id="glowCursor">
      <div class="glow-cursor-tail" id="glowCursorTail"></div>
      <div class="glow-cursor-halo"></div>
      <div class="glow-cursor-core"></div>
    </div>

    <div class="glow-cursor-ring" id="glowCursorRing">
      <svg viewBox="0 0 100 100" class="ring-svg">
        <circle class="ring-path" cx="50" cy="50" r="42" />
        <circle class="ring-bead" cx="90.6" cy="60.9" r="2.4" />
        <circle class="ring-bead" cx="46.4" cy="91.8" r="2.4" />
        <circle class="ring-bead" cx="8.6" cy="42.7" r="2.4" />
        <circle class="ring-bead" cx="71" cy="13.6" r="2.4" />
      </svg>
    </div>

    <canvas class="firefly-canvas" id="fireflyCanvas"></canvas>

    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#e8b04b" />
          <stop offset="50%" stop-color="#f2a3ad" />
          <stop offset="100%" stop-color="#b9c7a0" />
        </linearGradient>
      </defs>
    </svg>
    <button id="profileBtn" class="site-profile" aria-label="Profile">
      <img src="../Imgs/profile.jpg" alt="Profile" />
    </button>
    <div class="profile-menu" id="profileMenu">
      <button id="restartButton">↩ Restart</button>
      <button id="refreshButton">↻ Refresh</button>
      <button id="themeButton">🌙 Night Mode</button>
    </div>
    <button id="musicButton">Play Music</button>
    <main class="prank-page" id="prankPage">
      <div class="glow glow-one"></div>
      <div class="glow glow-two"></div>
      <div class="prank-content" id="prankContent">
        <div class="emoji-title">😈✨</div>
        <p class="eyebrow">WaIt... 👀</p>

        <h1>One Last Little Surprise...</h1>
        <p class="description">
          Oky... this one is actually for youh. 💫
          <br />
          No Tricks this time | Just CLick the Buttonn!
        </p>
        <button class="surprise-btn" id="surpriseBtn">OKAY, Continue ✨</button>

        <!--Final Message-->
        <div class="final-message" id="finalMessage">
          <h2>Okay Okayy...😂</h2>
          <p class="chilling">I'm just chilling now 😌</p>
          <div class="no-prank">No More Pranking!</div>
          <p class="probably">...probably... 👀 hehe🫣</p>
          <a href="birthday.html" class="continue-btn" id="birthdayBtn">
            Now Let's Celebrate 🎉
          </a>
        </div>
      </div>
    </main>
    <script src="../js/personalization.js"></script>
      <script src="../js/intro.js"></script>
      <script src="../js/music.js?v=20260819"></script>
      <script src="../js/firefly-cursor.js"></script>
      <script src="../js/theme.js?v=20260819"></script>
  </body>
</html>
