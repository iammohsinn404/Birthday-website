<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>One Last Secret 💗</title>

    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/scratch.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- Firefly Glow Cursor -->

    <div class="glow-cursor" id="glowCursor">
      <div class="glow-cursor-tail" id="glowCursorTail"></div>
      <div class="glow-cursor-halo"></div>
      <div class="glow-cursor-core"></div>
    </div>

    <div class="glow-cursor-ring" id="glowCursorRing">
      <svg viewBox="0 0 100 100" class="ring-svg">
        <circle class="ring-path" cx="50" cy="50" r="42" />
        <circle class="ring-bead" cx="90.6" cy="60.9" r="2.4" />
        <circle class="ring-bead" cx="46.4" cy="91.8" r="2.4" />
        <circle class="ring-bead" cx="8.6" cy="42.7" r="2.4" />
        <circle class="ring-bead" cx="71" cy="13.6" r="2.4" />
      </svg>
    </div>

    <canvas class="firefly-canvas" id="fireflyCanvas"></canvas>

    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#e8b04b" />
          <stop offset="50%" stop-color="#f2a3ad" />
          <stop offset="100%" stop-color="#b9c7a0" />
        </linearGradient>
      </defs>
    </svg>
    <button id="profileBtn" class="site-profile" aria-label="Profile">
      <img src="../Imgs/profile.jpg" alt="Profile" />
    </button>

    <div class="profile-menu" id="profileMenu">
      <button id="restartButton">↩ Restart</button>
      <button id="refreshButton">↻ Refresh</button>
      <button id="themeButton">🌙 Night Mode</button>
    </div>
    <button id="musicButton">Play Music</button>

    <section class="scratch-page scratch-page-open" id="scratchPage">
      <div class="scratch-content">
        <p class="scratch-small">✨ One Last Little Secret...</p>

        <h1>More Forward 💗</h1>

        <p class="scratch-instruction">
          Scratch the card to reveal the secret...
        </p>

        <!-- SCRATCH CARD -->

        <div class="scratch-card" id="scratchCard">
          <div class="hidden-message">
            <h2>You Found It! 💌</h2>

            <p>You made it all the way here! ❤️</p>

            <p>
              There is always something special waiting for the curious ones. ✨
            </p>
          </div>

          <canvas id="scratchCanvas"></canvas>
        </div>

        <!-- CONTINUE BUTTON -->

        <button class="scratch-continue-button" id="scratchContinueButton">
          💗 Reveal Final Message
        </button>
      </div>
    </section>

    <script src="../js/personalization.js"></script>
    <script src="../js/monkey.js"></script>
    <script src="../js/firefly-cursor.js"></script>
    <script src="../js/music.js?v=2"></script>
    <script src="../js/theme.js?v=2"></script>
  </body>
</html>
